<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>پستچی و کد تأیید</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b141a;--surface:#121f28;--soft:#1a2a35;--ink:#e6eef3;--mut:#94a9b8;--line:#243541;--wire:#46606f;
  --api:#8aa9ff;--apib:#172449;--db:#a3b2c2;--dbb:#1b2630;--mq:#ffa24a;--mqb:#3a2410;
  --ns:#4fd1c2;--nsb:#0f3330;--ext:#9aa3ad;--extb:#1d242b;
  --ok:#4cc47a;--okb:#11301f;--wa:#ffa24a;--wab:#3a2410;--td:#ff8f85;--tdb:#3d1a17;
  --onp:#0b141a;--skin:#f2c29b;--ink2:#2b2118;
  --f:"Vazirmatn",Tahoma,sans-serif;--m:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.8;direction:rtl;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1180px;margin:0 auto;height:100%;min-height:640px;display:flex;flex-direction:column;gap:10px}
h1,h3,p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--m);font-size:.88em}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:.8rem;color:var(--mut);font-weight:600}
h1{font-size:clamp(1.4rem,3vw,2rem);line-height:1.3;font-weight:800}
.hint{color:var(--mut);font-size:.82rem}
:root[dir="ltr"] body{direction:ltr}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;direction:ltr}
.lang button{font:inherit;font-size:.82rem;font-weight:800;border:0;background:var(--surface);color:var(--mut);padding:0 14px;cursor:pointer;line-height:1.9}
.lang button[aria-pressed="true"]{background:var(--api);color:var(--onp)}
.stage{flex:1;min-height:250px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow-x:auto;overflow-y:hidden;direction:ltr}
svg{display:block;width:100%;height:100%;min-width:760px}
.fa{direction:rtl;unicode-bidi:plaintext}
.t1{font:800 17px var(--f);fill:var(--ink)}
.t2{font:400 12px var(--m);fill:var(--mut)}
.t2f{font:600 12px var(--f);fill:var(--mut)}
.wire{fill:none;stroke:var(--wire);stroke-width:2;stroke-dasharray:5 6}
.box{stroke-width:2}
.halo{fill:none;stroke:var(--gl);stroke-width:9;opacity:0;transition:opacity .3s}
.node.on .halo{opacity:.28}
.node.on .box{stroke-width:3}
.off{display:none}
.slotr{fill:var(--mqb);stroke:var(--mq);stroke-width:1.5}
.row rect{stroke-width:1.5}
.row.nu rect{fill:var(--nsb);stroke:var(--ns)}
.row.us rect{fill:var(--soft);stroke:var(--wire)}
.row.ex rect{fill:var(--tdb);stroke:var(--td)}
.row text{font:600 13px var(--m);fill:var(--ink)}
.stamp{font:800 15px var(--f)}
.stamp.good{fill:var(--ok)}.stamp.bad{fill:var(--td)}
.sms rect{fill:var(--okb);stroke:var(--ok);stroke-width:1.5}
.sms text{font:600 13px var(--m);fill:var(--ok);text-anchor:middle}
.lab rect{fill:var(--c)}
.lab text{font:600 12px var(--m);fill:var(--onp);text-anchor:middle}
.env{fill:var(--surface);stroke:var(--c);stroke-width:2;stroke-linejoin:round}
.envf{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round}
.leg{transform-box:fill-box;transform-origin:50% 0}
.walking .legL{animation:swL .36s ease-in-out infinite alternate}
.walking .legR{animation:swR .36s ease-in-out infinite alternate}
@keyframes swL{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes swR{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
.hop{animation:hop .5s ease-out}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-14px)}70%{transform:translateY(0)}85%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.vib{transform-box:fill-box;transform-origin:center;animation:vib .6s}
@keyframes vib{0%,100%{transform:translate(0)}15%{transform:translate(-4px,0) rotate(-3deg)}35%{transform:translate(4px,0) rotate(3deg)}55%{transform:translate(-3px,0)}75%{transform:translate(3px,0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.mouth-s{display:none}.sad .mouth-s{display:block}.sad .mouth-h{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-weight:600;font-size:.85rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;line-height:1.9}
.chip b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--apib);color:var(--api);font-size:.75rem}
.chip.p2 b{background:var(--wab);color:var(--wa)}
.chip.cur{border-color:var(--api);background:var(--apib)}
.chip.p2.cur{border-color:var(--wa);background:var(--wab)}
.chip.done b{background:var(--ns);color:var(--onp)}
.chip.p2.done b{background:var(--wa);color:var(--onp)}
.chip:focus-visible,button:focus-visible{outline:3px solid var(--api);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 18px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px 22px}
.pl{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta{display:flex;gap:10px;align-items:center}
.phase{font-size:.75rem;font-weight:800;border-radius:999px;padding:0 10px;background:var(--apib);color:var(--api)}
.phase.x{background:var(--wab);color:var(--wa)}
.count{font-size:.8rem;color:var(--mut)}
.panel h3{font-size:1.1rem;font-weight:800;line-height:1.5}
.panel p{max-width:70ch;font-size:.93rem}
.code{margin-top:4px;font:400 .8rem var(--m);direction:ltr;unicode-bidi:isolate;text-align:left;background:var(--soft);border-radius:8px;padding:2px 10px;width:fit-content;max-width:100%;overflow-x:auto}
.quote{background:var(--wab);border-radius:14px;padding:8px 14px;border-inline-start:4px solid var(--wa);align-self:start}
.quote small{display:block;font-size:.75rem;font-weight:800;color:var(--wa)}
.quote q{quotes:none;font-size:.93rem}
.ctl{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.b{font:inherit;font-weight:600;border:0;border-radius:12px;padding:2px 18px;cursor:pointer;background:var(--api);color:var(--onp)}
button.b.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
button.b:disabled{opacity:.45;cursor:default}
.seg{margin-inline-start:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--mut)}
.seg button{font:inherit;font-size:.8rem;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:0 10px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--wa);background:var(--wab);color:var(--wa)}
@media (max-width:760px){.panel{grid-template-columns:1fr}.seg{margin-inline-start:0}}
@media (prefers-reduced-motion:reduce){.walking .legL,.walking .legR,.hop,.vib,.pop{animation:none}}
</style>

</head>
<body>
<div class="app">
<header>
  <div>
    <div class="eyebrow" data-en="CoreBanking · 9 steps from login to welcome">CoreBanking · ۹ مرحله از لاگین تا خوش‌آمد</div>
    <h1 data-en="The Postman and the Code">پستچی و کد تأیید</h1>
  </div>
  <div class="tools">
    <div class="hint" data-en="Click a step, or press Autoplay">روی شماره‌ها کلیک کن یا پخش خودکار رو بزن</div>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-l="fa" aria-pressed="true">فارسی</button><button type="button" data-l="en" aria-pressed="false">English</button></div>
  </div>
</header>

<div class="stage">
<svg id="svg" viewBox="0 0 1100 370" preserveAspectRatio="xMidYMid meet" role="img" aria-label="نمودار متحرک مسیر لاگین و تأیید کد بین اپ، API، RabbitMQ، Notification و sms.ir">
  <path class="wire" d="M180 100H290"/>
  <path class="wire" d="M460 100H546"/>
  <path class="wire" d="M656 100H676"/>
  <path class="wire" d="M776 100H860"/>
  <path class="wire" d="M375 145V232"/>
  <path class="wire" d="M955 145V232"/>
  <path class="wire" d="M955 322V360H105V196" style="opacity:.55"/>

  <g id="n-app" class="node" style="--gl:var(--api)">
    <rect class="halo" x="26" y="51" width="158" height="98" rx="18"/>
    <rect class="box" x="30" y="55" width="150" height="90" rx="14" fill="var(--apib)" stroke="var(--api)"/>
    <text class="t1 fa" x="105" y="92" text-anchor="middle" data-en="Mobile App">اپ موبایل</text>
    <text class="t2f fa" x="105" y="116" text-anchor="middle" data-en="Kivy · UI only">Kivy · فقط ظاهر</text>
  </g>
  <g id="n-api" class="node" style="--gl:var(--api)">
    <rect class="halo" x="286" y="51" width="178" height="98" rx="18"/>
    <rect class="box" x="290" y="55" width="170" height="90" rx="14" fill="var(--apib)" stroke="var(--api)"/>
    <text class="t1" x="375" y="92" text-anchor="middle">CoreBanking API</text>
    <text class="t2" x="375" y="116" text-anchor="middle">FastAPI · :8001</text>
  </g>
  <rect x="540" y="22" width="250" height="156" rx="16" fill="none" stroke="var(--mq)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="t1" x="665" y="46" text-anchor="middle" style="fill:var(--mq)">RabbitMQ</text>
  <g id="n-ex" class="node" style="--gl:var(--mq)">
    <rect class="halo" x="552" y="62" width="108" height="76" rx="14"/>
    <rect class="box" x="556" y="66" width="100" height="68" rx="12" fill="var(--mqb)" stroke="var(--mq)"/>
    <text class="t1" x="606" y="96" text-anchor="middle" style="fill:var(--mq)">Exchange</text>
    <text class="t2" x="606" y="118" text-anchor="middle">direct</text>
  </g>
  <g id="n-q" class="node" style="--gl:var(--mq)">
    <rect class="halo" x="672" y="62" width="108" height="76" rx="14"/>
    <rect class="box" x="676" y="66" width="100" height="68" rx="12" fill="var(--mqb)" stroke="var(--mq)"/>
    <text class="t1" x="726" y="90" text-anchor="middle" style="fill:var(--mq)">Queue</text>
    <rect x="696" y="102" width="60" height="22" rx="4" fill="none" stroke="var(--mq)" stroke-dasharray="3 3"/>
    <g id="qLetter" class="off"><rect class="slotr" x="696" y="102" width="60" height="22" rx="4"/><path d="M698 104L726 118L754 104" fill="none" stroke="var(--mq)" stroke-width="1.5"/></g>
  </g>
  <text class="t2f fa" x="665" y="166" text-anchor="middle">routing key: notification</text>
  <g id="n-ns" class="node" style="--gl:var(--ns)">
    <rect class="halo" x="856" y="51" width="198" height="98" rx="18"/>
    <rect class="box" x="860" y="55" width="190" height="90" rx="14" fill="var(--nsb)" stroke="var(--ns)"/>
    <text class="t1" x="955" y="92" text-anchor="middle">Notification</text>
    <text class="t2f fa" x="955" y="116" text-anchor="middle" data-en="Always listening">همیشه گوش به زنگ</text>
  </g>
  <g id="n-sql" class="node" style="--gl:var(--db)">
    <rect class="halo" x="286" y="228" width="178" height="124" rx="18"/>
    <rect class="box" x="290" y="232" width="170" height="116" rx="14" fill="var(--dbb)" stroke="var(--db)"/>
    <text class="t1" x="375" y="260" text-anchor="middle">SQL Server</text>
    <text class="t2" x="375" y="278" text-anchor="middle">otp table</text>
    <g id="sqlrow" class="row off"><rect x="302" y="294" width="146" height="40" rx="8"/><text id="rowCode" x="314" y="319">20329</text><text id="rowSt" x="440" y="319" text-anchor="end">not used</text></g>
  </g>
  <g id="n-sms" class="node" style="--gl:var(--ext)">
    <rect class="halo" x="856" y="228" width="198" height="98" rx="18"/>
    <rect class="box" x="860" y="232" width="190" height="90" rx="14" fill="var(--extb)" stroke="var(--ext)"/>
    <text class="t1" x="955" y="270" text-anchor="middle">sms.ir</text>
    <text class="t2f fa" x="955" y="294" text-anchor="middle" data-en="SMS provider">سرویس پیامک</text>
  </g>
  <text id="stamp" class="stamp fa off" x="474" y="288" text-anchor="end"></text>
  <text id="stamp2" class="t2f fa off" x="474" y="308" text-anchor="end"></text>
  <g id="smsMsg" class="sms off"><rect x="30" y="152" width="150" height="38" rx="12"/><text x="105" y="177">SMS: 20329</text></g>
  <g id="conf"></g>

  <g id="pm">
    <g id="pmHop"><g id="pmFlip">
      <g class="leg legL"><rect x="-8" y="10" width="7" height="20" rx="3" fill="var(--ink2)"/></g>
      <g class="leg legR"><rect x="1" y="10" width="7" height="20" rx="3" fill="var(--ink2)"/></g>
      <rect x="-14" y="-10" width="28" height="26" rx="8" fill="var(--api)"/>
      <rect x="-22" y="-4" width="14" height="18" rx="4" fill="var(--mq)"/>
      <path d="M-16 -9L12 14" stroke="var(--ink2)" stroke-width="2.5" fill="none"/>
      <rect x="9" y="-6" width="15" height="6" rx="3" fill="var(--api)" transform="rotate(-40 9 -3)"/>
      <circle cx="0" cy="-22" r="12" fill="var(--skin)"/>
      <path d="M-13 -25A13 12 0 0 1 13 -25Z" fill="var(--api)"/>
      <rect x="-3" y="-27" width="20" height="5" rx="2.5" fill="var(--api)"/>
      <circle cx="-4" cy="-21" r="1.7" fill="var(--ink2)"/><circle cx="5" cy="-21" r="1.7" fill="var(--ink2)"/>
      <g class="mouth-h"><path d="M-4 -15Q0 -11 5 -15" stroke="var(--ink2)" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>
      <g class="mouth-s"><path d="M-4 -12Q0 -16 5 -12" stroke="var(--ink2)" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>
    </g></g>
    <g id="carry" class="off">
      <g id="lab" class="lab"><rect/><text/></g>
      <g id="env"><rect class="env" x="-17" y="-12" width="34" height="24" rx="3"/><path class="envf" d="M-17 -12L0 2L17 -12"/></g>
    </g>
  </g>
</svg>
</div>

<div class="chips" id="chips" role="group" aria-label="مرحله‌ها"></div>

<div class="panel" aria-live="polite">
  <div class="pl">
    <div class="meta"><span class="phase" id="phase"></span><span class="count" id="count"></span></div>
    <h3 id="title"></h3>
    <p id="text"></p>
    <div class="code" id="code"></div>
  </div>
  <div class="quote"><small data-en="The postman says">پستچی می‌گه</small><q id="quote"></q></div>
  <div class="ctl">
    <button class="b alt" id="prev" type="button" data-en="Previous">قبلی</button>
    <button class="b" id="next" type="button" data-en="Next">بعدی</button>
    <button class="b alt" id="play" type="button" aria-pressed="false">پخش خودکار</button>
    <div class="seg" role="group" aria-label="حالت کد در مرحله‌ی ۸ و ۹">
      <span data-en="Code case (steps 8 and 9):">حالت کد (مرحله‌ی ۸ و ۹):</span>
      <button type="button" data-sc="ok" aria-pressed="true" data-en="Correct code">کد درست</button>
      <button type="button" data-sc="reuse" aria-pressed="false" data-en="Reused code">کد دوباره‌استفاده</button>
      <button type="button" data-sc="expired" aria-pressed="false" data-en="Expired code">کد منقضی</button>
    </div>
  </div>
</div>
</div>

<script>
(function(){
var NS='http://www.w3.org/2000/svg';
var $=function(s){return document.querySelector(s)};
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var FA='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA[d]})}
var P={appR:[190,100],apiL:[280,100],apiR:[470,100],exL:[546,100],qR:[786,100],nsL:[850,100],apiB:[375,172],sqlT:[375,208],nsB:[955,172],smsT:[955,208]};
var STEPS=[
{chip:'ورود',part:1,active:['app','api'],path:[P.appR,P.apiL],c:'--api',lab:'mobile + password',
 title:'اپ فقط یه نامه می‌نویسه',
 text:'کاربر شماره‌ی موبایل و رمزش رو تو اپ می‌زنه. اپ خودش هیچ تصمیمی نمی‌گیره، فقط نامه رو می‌ده دست پستچی تا ببره پیش API.',
 code:'POST /api/v1/auth/login  { mobile, password }',
 quote:'نامه‌ی ورود! لطفاً قبل از امضا، رمزتون رو به کسی نگید.'},
{chip:'ذخیره‌ی کد',part:1,active:['api','sql'],path:[P.apiB,P.sqlT],c:'--db',lab:'code 20329 + expires_at',
 title:'API کد رو می‌سازه و تو دفتر می‌نویسه',
 text:'API رمز رو چک می‌کنه، بعد یه کد ۵ رقمی می‌سازه و با زمان انقضا (۲ دقیقه بعد) تو جدول otp ذخیره می‌کنه. کد مثل نون تازه‌ست و دیر بشه بیات می‌شه.',
 code:'OtpBusinessLogic.send_otp()  →  otp_repository.insert()',
 quote:'کد رو تو دفتر ثبت کردم. ۲ دقیقه وقت داره، بعدش بیات می‌شه!'},
{chip:'انتشار',part:1,active:['api','ex','q'],path:[P.apiR,P.exL],c:'--mq',lab:'{ phone, content }',
 title:'API پیامک نمی‌فرسته، پیام رو می‌ندازه تو صندوق',
 text:'فرستادن پیامک کار API نیست. فقط یه پیام می‌سازه و تو RabbitMQ می‌ندازه. Exchange با routing key «notification» اون رو می‌فرسته تو صف.',
 code:'NotificationPublisher.publish(phone, content)',
 quote:'نامه رو انداختم تو صندوق. از اینجا به بعد دیگه به من ربطی نداره!'},
{chip:'دریافت',part:1,active:['q','ns'],path:[P.qR,P.nsL],c:'--ns',lab:'{ phone, content }',
 title:'Notification همیشه گوش به زنگه',
 text:'میکروسرویس Notification یه پروژه‌ی جداست که همیشه منتظر صفه. هر پیامی که برسه رو برمی‌داره، بدون اینکه به API خبر بده.',
 code:'NotificationMicroservice  →  consume("notification-queue")',
 quote:'صف خلوت بود، پیام رو سریع برداشتم و رفتم!'},
{chip:'پاسخ',part:1,active:['api','app'],path:[P.apiL,P.appR],c:'--ok',lab:'"Code was sent."',
 title:'API معطل پیامک نمی‌مونه',
 text:'همین‌که پیام رفت تو صف، API به اپ جواب می‌ده: «Code was sent.». این جواب هم‌زمان با مرحله‌ی ۴ و ۶ اتفاق می‌افته، پس کاربر معطل نمی‌شه.',
 code:'Response(is_success=True, message="Code was sent.")',
 quote:'من سریع‌ترین پستچی شهرم! جواب رسید و پیامک هنوز تو راهه.'},
{chip:'پیامک',part:1,active:['ns','sms','app'],path:[P.nsB,P.smsT],c:'--ns',lab:'POST (HTTP)',
 title:'sms.ir پیامک رو می‌فرسته',
 text:'Notification با یه درخواست HTTP به sms.ir می‌گه این پیام رو برای این شماره بفرست. چند ثانیه بعد گوشی کاربر می‌لرزه.',
 code:'Notification  →  HTTP  →  sms.ir',
 quote:'پیامک رفت! گوشی لرزید؟ یعنی کار من تموم شد.'},
{chip:'تأیید',part:2,active:['app','api'],path:[P.appR,P.apiL],c:'--api',lab:'mobile + password + code',
 title:'کاربر کد رو می‌زنه',
 text:'کاربر کدی که پیامک شده رو تو اپ می‌نویسه. اپ شماره، رمز و کد رو با هم می‌فرسته، چون API چیزی از لاگین قبلی یادش نمی‌مونه.',

 ok:{stamp:'✓ کد درسته',stamp2:'استفاده‌نشده و معتبر',good:true,st:'used',lab:'"Welcome ..."'},

  title:'نامه برگشت خورد',text:'این کد قبلاً استفاده شده، پس API نامه رو رد می‌کنه: «The code is invalid or expired.». هر کد فقط یک بار کار می‌کنه.',
  code:'Response(False, "The code is invalid or expired.")',quote:'نامه برگشت خورد! کد دست‌دومه، قبول نمی‌کنن.'},
 expired:{stamp:'✗ کد منقضی شده',stamp2:'بیشتر از ۲ دقیقه گذشته',good:false,st:'expired',lab:'invalid or expired',

  code:'Response(False, "The code is invalid or expired.")',quote:'دیر رسیدیم! کد بیات شده بود.'}

var EN=[
{chip:'Login',title:'The app just writes a letter',text:'The user types their mobile number and password. The app decides nothing by itself. It hands the letter to the postman, who carries it to the API.',quote:'Login letter! Please do not tell anyone your password before signing.'},
{chip:'Save OTP',title:'The API makes a code and writes it in the book',text:'The API checks the password, then creates a 5-digit code and saves it in the otp table with an expiry time (2 minutes later). The code is like fresh bread: it goes stale quickly.',quote:'I wrote the code in the book. It has 2 minutes before it goes stale!'},
{chip:'Publish',title:'The API does not send SMS, it drops a message in the mailbox',text:'Sending SMS is not the API job. It only builds a message and puts it in RabbitMQ. The Exchange uses the routing key “notification” to send it into the queue.',quote:'Dropped the letter in the mailbox. Not my problem from here on!'},

{chip:'SMS',title:'sms.ir sends the text message',text:'Notification sends one HTTP request to sms.ir: send this message to this number. A few seconds later the phone of the user buzzes.',quote:'SMS sent! Did the phone buzz? Then my job here is done.'},

{chip:'Welcome',title:'The app says welcome',text:'The API answers “Welcome ...” with the name of the customer, and the app opens the accounts page. The end!',quote:'Delivered! Now I will go and have some tea.'}
];
var SCE={
 ok:{stamp:'✓ Code is correct',stamp2:'Not used and still valid'},
 reuse:{stamp:'✗ Code already used',stamp2:'One use per code',title:'The letter came back',text:'This code was already used, so the API rejects it: “The code is invalid or expired.” Every code works only once.',quote:'Letter returned! A second-hand code, they will not accept it.'},
 expired:{stamp:'✗ Code expired',stamp2:'More than 2 minutes passed',title:'Too late, the code went stale',text:'More than 2 minutes passed and the code expired. The API answers “The code is invalid or expired.” and the user must log in again to get a new code.',quote:'We are late! The code went stale.'}
};
var UI={fa:{prev:'قبلی',next:'بعدی',play:'پخش خودکار',stop:'توقف',p1:'بخش ۱ · ورود',p2:'بخش ۲ · تأیید کد',step:function(i,n){return 'مرحله‌ی '+fa(i)+' از '+fa(n)},num:fa},
 en:{prev:'Previous',next:'Next',play:'Autoplay',stop:'Stop',p1:'Part 1 · Login',p2:'Part 2 · Verify code',step:function(i,n){return 'Step '+i+' of '+n},num:String}};
var lang='fa';
try{var sl=localStorage.getItem('cbLang');if(sl==='en'||sl==='fa')lang=sl}catch(e){}
function txt(i,k){
  var base=lang==='en'?EN[i]:STEPS[i];
  if(i===8&&scn!=='ok'){var o=lang==='en'?SCE[scn]:SC[scn];if(o[k]!==undefined)return o[k]}
  return base[k];
}
function code(i){var s=STEPS[i];if(i===8&&scn!=='ok'&&SC[scn].code)return SC[scn].code;return s.code}
function stampOf(){return lang==='en'?SCE[scn]:SC[scn]}
var cur=0,token=0,scn='ok',playing=false,timer=null,flip=1;
var pm=$('#pm'),pmHop=$('#pmHop'),pmFlip=$('#pmFlip'),carry=$('#carry'),lab=$('#lab');

var chips=$('#chips');
STEPS.forEach(function(s,i){
  var b=document.createElement('button');b.type='button';b.className='chip'+(s.part===2?' p2':'');
  b.addEventListener('click',function(){stopPlay();go(i)});
  chips.appendChild(b);
});
function fillChips(){
  Array.prototype.forEach.call(chips.children,function(b,i){
    b.innerHTML='<b>'+UI[lang].num(i+1)+'</b>'+(lang==='en'?EN[i].chip:STEPS[i].chip);
  });
}

function show(el,on){el.classList.toggle('off',!on)}
function setPos(x,y,dir){
  pm.setAttribute('transform','translate('+x+' '+y+') scale(1.15)');
  if(dir){flip=dir;pmFlip.setAttribute('transform','scale('+dir+' 1)')}
  carry.setAttribute('transform','translate('+(flip*26)+' -44)');
}
function setLabel(text,c){
  carry.style.setProperty('--c','var('+c+')');
  var t=lab.querySelector('text'),r=lab.querySelector('rect');
  t.textContent=text;t.setAttribute('x',0);t.setAttribute('y',-30);
  var w=t.getComputedTextLength?t.getComputedTextLength():text.length*7;
  r.setAttribute('x',-w/2-8);r.setAttribute('y',-43);r.setAttribute('width',w+16);r.setAttribute('height',19);r.setAttribute('rx',9);
}
function rowState(i,phase){
  var s=SC[scn],visible=(i>1)||(i===1&&phase==='end');
  var st='not used',cls='nu';
  if(scn==='reuse'){st='used';cls='us'}
  if(i>=7&&phase==='end'||i===8){
    if(scn==='ok'){st='used';cls='us'}
    if(scn==='expired'){st='expired';cls='ex'}
  }
  var row=$('#sqlrow');show(row,visible);
  row.setAttribute('class','row '+cls+(visible?'':' off'));
  $('#rowSt').textContent=st;
  var stampOn=(i===7&&phase==='end')||i===8;
  var sp=$('#stamp'),sp2=$('#stamp2');
  show(sp,stampOn);show(sp2,stampOn);
  if(stampOn){var so=stampOf();sp.textContent=so.stamp;sp2.textContent=so.stamp2;sp.setAttribute('class','stamp'+(lang==='fa'?' fa ':' ')+(s.good?'good':'bad'))}
  var anc=lang==='en'?'start':'end';sp.setAttribute('text-anchor',anc);sp2.setAttribute('text-anchor',anc);sp2.classList.toggle('fa',lang==='fa');
}
function nodeState(i,phase){
  ['app','api','ex','q','ns','sql','sms'].forEach(function(n){
    $('#n-'+n).classList.toggle('on',STEPS[i].active.indexOf(n)>-1);
  });
  show($('#qLetter'),i===2&&phase==='end');
  show($('#smsMsg'),(i===5&&phase==='end')||i===6||i===7);
  rowState(i,phase);
}
function confetti(){
  var g=$('#conf');g.innerHTML='';
  var cols=['--api','--mq','--ns','--ok','--wa'];
  for(var k=0;k<16;k++){
    var c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',105);c.setAttribute('cy',100);c.setAttribute('r',4);
    c.setAttribute('fill','var('+cols[k%5]+')');g.appendChild(c);
    var a=Math.PI*2*k/16,d=60+Math.random()*40;
    if(c.animate&&!reduce)c.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d-20)+'px)',opacity:0}],{duration:1100,easing:'ease-out'});
  }
  setTimeout(function(){g.innerHTML=''},1150);
}
function vibrate(id){
  var el=$(id);el.classList.remove('vib');void el.getBoundingClientRect();el.classList.add('vib');
}
function hopNow(){pmHop.classList.remove('hop');void pmHop.getBoundingClientRect();pmHop.classList.add('hop')}
function smsFly(tk){
  return new Promise(function(res){
    var pts=[[955,322],[955,360],[105,360],[105,198]],g=$('#conf');g.innerHTML='';
    var e=document.createElementNS(NS,'g');
    e.innerHTML='<rect x="-17" y="-12" width="34" height="24" rx="3" fill="var(--okb)" stroke="var(--ok)" stroke-width="2"/><path d="M-17 -12L0 2L17 -12" fill="none" stroke="var(--ok)" stroke-width="2"/>';
    g.appendChild(e);
    run(pts,reduce?1:1700,function(x,y){e.setAttribute('transform','translate('+x+' '+y+')')},tk,function(){g.innerHTML='';res()});
  });
}
function run(pts,dur,onpos,tk,done){
  var seg=[],tot=0,i;
  for(i=1;i<pts.length;i++){var l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);tot+=l}
  var t0=null;
  function frame(ts){
    if(tk!==token)return;
    if(t0===null)t0=ts;
    var t=Math.min(1,(ts-t0)/dur),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,d=e*tot,k=0;
    while(k<seg.length-1&&d>seg[k]){d-=seg[k];k++}
    var f=seg[k]?d/seg[k]:1,x=pts[k][0]+(pts[k+1][0]-pts[k][0])*f,y=pts[k][1]+(pts[k+1][1]-pts[k][1])*f;
    var dx=pts[k+1][0]-pts[k][0];
    onpos(x,y,dx,ts);
    if(t<1)requestAnimationFrame(frame);else done();
  }
  requestAnimationFrame(frame);
}
function panel(i){
  var s=STEPS[i];
  $('#phase').textContent=s.part===1?UI[lang].p1:UI[lang].p2;
  $('#phase').className='phase'+(s.part===2?' x':'');
  $('#count').textContent=UI[lang].step(i+1,STEPS.length);
  $('#title').textContent=txt(i,'title');
  $('#text').textContent=txt(i,'text');
  $('#code').textContent=code(i);
  $('#quote').textContent=txt(i,'quote');
  Array.prototype.forEach.call(chips.children,function(b,k){
    b.classList.toggle('cur',k===i);b.classList.toggle('done',k<i);
    if(k===i)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');
  });
  $('#prev').disabled=i===0;
  $('#next').disabled=i===STEPS.length-1;
}
function go(i){
  token++;var tk=token;cur=i;
  var s=STEPS[i],pts=s.path.slice(),sc=SC[scn];
  var lbl=s.lab,color=s.c,last=i===8;
  if(last){lbl=sc.lab;color=sc.good?'--ok':'--td'}
  pm.classList.remove('sad');pmHop.classList.remove('hop');
  panel(i);nodeState(i,'start');
  $('#conf').innerHTML='';
  var dir0=Math.sign(pts[1][0]-pts[0][0])||flip;
  setPos(pts[0][0],pts[0][1],dir0);
  setLabel(lbl,color);show(carry,true);
  pm.classList.add('walking');
  var len=Math.hypot(pts[1][0]-pts[0][0],pts[1][1]-pts[0][1]);
  var dur=reduce?1:Math.max(1200,len/0.085);
  run(pts,dur,function(x,y,dx,ts){
    var bob=reduce?0:Math.sin(ts/70)*1.6;
    setPos(x,y+bob,Math.sign(dx)||flip);
  },tk,function(){
    pm.classList.remove('walking');
    setPos(pts[1][0],pts[1][1],flip);
    show(carry,false);hopNow();
    nodeState(i,'end');
    var after=Promise.resolve();
    if(i===5){after=smsFly(tk).then(function(){if(tk!==token)return;nodeState(i,'end');show($('#smsMsg'),true);vibrate('#n-app')})}
    if(i===2){var q=$('#qLetter');q.classList.remove('pop');void q.getBoundingClientRect();q.classList.add('pop')}
    if(i===8){
      if(sc.good){confetti();vibrate('#n-app')}
      else{pm.classList.add('sad');vibrate('#n-app')}
    }
    after.then(function(){
      if(tk!==token)return;
      if(playing){
        clearTimeout(timer);
        timer=setTimeout(function(){
          if(!playing)return;
          if(cur<STEPS.length-1)go(cur+1);else stopPlay();
        },1700);
      }
    });
  });
}
function stopPlay(){playing=false;clearTimeout(timer);var b=$('#play');b.textContent=UI[lang].play;b.setAttribute('aria-pressed','false')}
$('#play').addEventListener('click',function(){
  if(playing){stopPlay();return}
  playing=true;this.textContent=UI[lang].stop;this.setAttribute('aria-pressed','true');
  if(cur>=STEPS.length-1)go(0);else go(cur);
});
$('#next').addEventListener('click',function(){stopPlay();if(cur<STEPS.length-1)go(cur+1)});
$('#prev').addEventListener('click',function(){stopPlay();if(cur>0)go(cur-1)});
document.querySelectorAll('.seg button').forEach(function(b){
  b.addEventListener('click',function(){
    scn=b.getAttribute('data-sc');
    document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    if(cur>=7){stopPlay();go(cur)}
  });
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'){stopPlay();if(cur<STEPS.length-1)go(cur+1)}
  if(e.key==='ArrowRight'){stopPlay();if(cur>0)go(cur-1)}
});
function applyLang(){
  var d=document.documentElement;d.lang=lang;d.dir=lang==='fa'?'rtl':'ltr';
  document.title=lang==='en'?'The Postman and the Code':'پستچی و کد تأیید';
  document.querySelectorAll('[data-en]').forEach(function(el){
    if(el.getAttribute('data-fa')===null)el.setAttribute('data-fa',el.textContent);
    el.textContent=lang==='en'?el.getAttribute('data-en'):el.getAttribute('data-fa');
  });
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-l')===lang?'true':'false')});
  fillChips();
  $('#play').textContent=playing?UI[lang].stop:UI[lang].play;
  panel(cur);
  var sp=$('#stamp');
  if(!sp.classList.contains('off')){var so=stampOf();sp.textContent=so.stamp;$('#stamp2').textContent=so.stamp2}
  var anc=lang==='en'?'start':'end';sp.setAttribute('text-anchor',anc);$('#stamp2').setAttribute('text-anchor',anc);$('#stamp2').classList.toggle('fa',lang==='fa');sp.classList.toggle('fa',lang==='fa');
}
document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click',function(){
    lang=b.getAttribute('data-l');
    try{localStorage.setItem('cbLang',lang)}catch(e){}
    applyLang();
  });
});
applyLang();
go(0);
})();
</script>
